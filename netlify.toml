[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/describe-reference-images"
  to = "/.netlify/functions/describe-reference-images"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
